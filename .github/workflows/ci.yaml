name: CI

on:
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "argocd/**"
      - ".github/workflows/ci.yaml"

  pull_request:
    paths:
      - "kubernetes/**"
      - "argocd/**"
      - ".github/workflows/ci.yaml"

jobs:
  validate-kubernetes:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate dev overlay
        run: |
          kustomize build kubernetes/overlays/dev/nginx > /tmp/rendered.yaml

      - name: Check rendered manifests
        run: |
          test -s /tmp/rendered.yaml